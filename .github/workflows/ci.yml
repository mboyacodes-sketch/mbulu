name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          # Placeholders only — API routes read env at request time.
          CHAT_API_KEY: ci
          CHAT_BASE_URL: https://example.com/v1
          CHAT_MODEL: ci
          CHAT_SYSTEM_PROMPT: You are Mbulu in CI.
          CHAT_ALLOWED_ORIGINS: http://localhost:3000
